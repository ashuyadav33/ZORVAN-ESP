<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <title>ZORVAN — Competitive Esports</title>

  <meta
    name="description"
    content="ZORVAN — A new competitive esports experience."
  >


  <style>

    /* =================================
       RESET
    ================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #05070b;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background: #05070b;

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* =================================
       CINEMATIC BACKGROUND
    ================================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: -2;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(22,131,255,.14),
          transparent 38%
        ),

        radial-gradient(
          circle at 85% 35%,
          rgba(116,108,255,.06),
          transparent 28%
        );
    }


    body::after {
      content: "";

      position: fixed;

      width: 520px;
      height: 520px;

      left: 50%;
      top: -260px;

      transform: translateX(-50%);

      pointer-events: none;

      z-index: -1;

      background:
        radial-gradient(
          circle,
          rgba(22,131,255,.12),
          transparent 68%
        );

      filter: blur(30px);
    }


    /* =================================
       ZORVAN LOGO REVEAL
    ================================= */

    .logo-reveal {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background: #05070b;

      pointer-events: none;

      animation:
        reveal-screen-out
        .9s
        cubic-bezier(.77,0,.18,1)
        3.2s
        forwards;
    }


    /* Blue glow behind logo */

    .logo-reveal-glow {

      position: absolute;

      width: 460px;
      height: 460px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(22,131,255,.20),
          rgba(22,131,255,.06) 38%,
          transparent 70%
        );

      filter: blur(28px);

      animation:
        reveal-glow
        2.8s
        ease-out
        forwards;
    }


    /* Logo */

    .reveal-logo-wrap {

      position: relative;

      z-index: 2;

      width: min(320px, 72vw);

      display: flex;

      align-items: center;

      justify-content: center;

      animation:
        reveal-logo-in
        1.15s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        reveal-logo-out
        .65s
        ease-in
        2.35s
        forwards;
    }


    .reveal-logo {

      width: 100%;

      height: auto;

      display: block;

      opacity: 0;

      transform: scale(.72);

      filter:
        drop-shadow(
          0 0 0
          rgba(22,131,255,0)
        )
        blur(10px);
    }


    /* Blue line */

    .reveal-line {

      position: relative;

      z-index: 2;

      width: 0;

      height: 1px;

      margin-top: 26px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #1683ff,
          transparent
        );

      box-shadow:
        0 0 14px
        rgba(22,131,255,.75);

      animation:
        reveal-line-in
        .75s
        cubic-bezier(.16,1,.3,1)
        .8s
        forwards;
    }


    /* =================================
       LOGO ANIMATIONS
    ================================= */

    @keyframes reveal-logo-in {

      0% {

        opacity: 0;

        transform:
          scale(.72);

        filter:
          drop-shadow(
            0 0 0
            rgba(22,131,255,0)
          )
          blur(10px);
      }

      55% {

        opacity: 1;
      }

      100% {

        opacity: 1;

        transform:
          scale(1);

        filter:
          drop-shadow(
            0 0 42px
            rgba(22,131,255,.28)
          )
          blur(0);
      }
    }


    @keyframes reveal-logo-out {

      to {

        opacity: 0;

        transform:
          scale(1.045);

        filter:
          drop-shadow(
            0 0 60px
            rgba(22,131,255,.20)
          )
          blur(2px);
      }
    }


    @keyframes reveal-glow {

      0% {

        opacity: 0;

        transform:
          scale(.65);
      }

      40% {

        opacity: 1;
      }

      100% {

        opacity: .2;

        transform:
          scale(1.12);
      }
    }


    @keyframes reveal-line-in {

      to {

        width: 160px;
      }
    }


    @keyframes reveal-screen-out {

      0% {

        opacity: 1;
      }

      100% {

        opacity: 0;

        visibility: hidden;
      }
    }


    /* =================================
       PREMIUM NAVBAR
    ================================= */

    .z-nav {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 900;

      height: 82px;

      display: flex;

      align-items: center;

      padding:
        0 5vw;

      background:
        linear-gradient(
          180deg,
          rgba(5,7,11,.94),
          rgba(5,7,11,.68)
        );

      border-bottom:
        1px solid
        rgba(255,255,255,.045);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    /* Navbar logo */

    .z-nav-logo {

      width: 118px;

      height: auto;

      display: block;

      object-fit: contain;

      flex-shrink: 0;

      transition:
        transform .3s ease,
        filter .3s ease;
    }


    .z-nav-logo:hover {

      transform:
        scale(1.035);

      filter:
        drop-shadow(
          0 0 18px
          rgba(22,131,255,.30)
        );
    }


    /* Desktop links */

    .z-nav-links {

      display: flex;

      align-items: center;

      gap: 32px;

      margin-left: auto;
    }


    .z-nav-link {

      position: relative;

      color:
        rgba(255,255,255,.68);

      font-size: 13px;

      font-weight: 600;

      letter-spacing: .04em;

      transition:
        color .25s ease;
    }


    .z-nav-link:hover {

      color: #ffffff;
    }


    .z-nav-link::after {

      content: "";

      position: absolute;

      left: 50%;

      bottom: -8px;

      width: 0;

      height: 1px;

      transform:
        translateX(-50%);

      background: #1683ff;

      box-shadow:
        0 0 10px
        rgba(22,131,255,.7);

      transition:
        width .3s ease;
    }


    .z-nav-link:hover::after {

      width: 100%;
    }


    /* Navbar CTA */

    .z-nav-cta {

      margin-left: 30px;

      padding:
        11px 18px;

      border:
        1px solid
        rgba(22,131,255,.45);

      border-radius: 6px;

      color: #ffffff;

      background:
        rgba(22,131,255,.08);

      font-size: 12px;

      font-weight: 700;

      letter-spacing: .05em;

      transition:
        .3s ease;
    }


    .z-nav-cta:hover {

      background:
        rgba(22,131,255,.16);

      border-color:
        rgba(22,131,255,.8);

      box-shadow:
        0 0 24px
        rgba(22,131,255,.16);

      transform:
        translateY(-1px);
    }


    /* Mobile menu */

    .z-menu {

      display: none;

      width: 40px;

      height: 40px;

      margin-left: auto;

      align-items: center;

      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 8px;

      background:
        rgba(255,255,255,.035);

      color: #ffffff;

      cursor: pointer;
    }


    .z-menu-lines {

      width: 18px;

      display: flex;

      flex-direction: column;

      gap: 4px;
    }


    .z-menu-lines span {

      width: 100%;

      height: 1px;

      background: #ffffff;
    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 700px) {

      body::after {

        width: 360px;

        height: 360px;

        top: -180px;
      }


      .logo-reveal-glow {

        width: 320px;

        height: 320px;
      }


      .reveal-logo-wrap {

        width:
          min(240px, 68vw);
      }


      .reveal-line {

        margin-top: 20px;
      }


      .z-nav {

        height: 68px;

        padding:
          0 20px;
      }


      .z-nav-logo {

        width: 92px;
      }


      .z-nav-links,
      .z-nav-cta {

        display: none;
      }


      .z-menu {

        display: flex;
      }
    }

  </style>

</head>


<body>


  <!-- =================================
       ZORVAN LOGO REVEAL
  ================================= -->

  <div class="logo-reveal">

    <div class="logo-reveal-glow"></div>

    <div class="reveal-logo-wrap">

      <img
        src="./logo.png"
        class="reveal-logo"
        alt="ZORVAN"
      >

    </div>

    <div class="reveal-line"></div>

  </div>


  <!-- =================================
       ZORVAN NAVBAR
  ================================= -->

  <nav class="z-nav">

    <a
      href="#"
      aria-label="ZORVAN Home"
    >

      <img
        src="./logo.png"
        class="z-nav-logo"
        alt="ZORVAN"
      >

    </a>


    <div class="z-nav-links">

      <a
        href="#about"
        class="z-nav-link"
      >
        ABOUT
      </a>

      <a
        href="#features"
        class="z-nav-link"
      >
        FEATURES
      </a>

      <a
        href="#legacy"
        class="z-nav-link"
      >
        LEGACY
      </a>

      <a
        href="#community"
        class="z-nav-link"
      >
        COMMUNITY
      </a>

    </div>


    <a
      href="#register"
      class="z-nav-cta"
    >
      PRE-REGISTER
    </a>


    <button
      class="z-menu"
      aria-label="Open menu"
    >

      <span class="z-menu-lines">

        <span></span>
        <span></span>
        <span></span>

      </span>

    </button>

  </nav>


</body>

  </html>
