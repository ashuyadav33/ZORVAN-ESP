<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#05070b">

  <title>ZORVAN — Competitive Esports</title>

  <meta name="description"
        content="ZORVAN — A new competitive esports experience.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #05070b;
    }

    body {
      min-height: 100vh;
      background: #05070b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: #1683ff;
      color: #ffffff;
    }
        /* ===== ZORVAN V2 — PREMIUM DESIGN SYSTEM ===== */

    :root {
      --bg: #05070b;
      --bg-soft: #090d14;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-strong: rgba(255, 255, 255, 0.07);

      --white: #ffffff;
      --text: #e9eef7;
      --muted: #8993a5;

      --blue: #1683ff;
      --blue-bright: #42a5ff;
      --violet: #746cff;

      --line: rgba(255, 255, 255, 0.09);

      --radius-lg: 28px;
      --radius-md: 18px;

      --container: 1240px;
    }

    body {
      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(22, 131, 255, 0.14),
          transparent 38%
        ),
        radial-gradient(
          circle at 85% 35%,
          rgba(116, 108, 255, 0.06),
          transparent 28%
        ),
        var(--bg);
    }

    /* Cinematic atmosphere */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -3;

      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 80px 80px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
      );
    }

    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      left: 50%;
      top: -260px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -2;

      background: radial-gradient(
        circle,
        rgba(22, 131, 255, 0.12),
        transparent 68%
      );

      filter: blur(30px);
    }

    /* Smooth global rendering */

    img {
      max-width: 100%;
      display: block;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Mobile foundation */

    @media (max-width: 700px) {
      :root {
        --radius-lg: 22px;
        --radius-md: 15px;
      }

      body::before {
        background-size: 55px 55px;
      }

      body::after {
        width: 360px;
        height: 360px;
        top: -180px;
      }
      }
        /* ===== CINEMATIC LOGO REVEAL ===== */

    .logo-reveal {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #05070b;

      pointer-events: none;

      animation: revealScreenOut 0.9s
        cubic-bezier(.77,0,.18,1)
        2.25s forwards;
    }

    .logo-reveal-glow {
      position: absolute;

      width: 460px;
      height: 460px;

      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(22,131,255,.18),
        rgba(22,131,255,.05) 35%,
        transparent 70%
      );

      filter: blur(24px);

      animation: revealGlow 2.2s ease-out forwards;
    }

    .reveal-logo {
      position: relative;
      z-index: 2;

      width: min(270px, 62vw);
      height: auto;

      object-fit: contain;

      opacity: 0;
      transform: scale(.72);

      filter:
        drop-shadow(0 0 0 rgba(22,131,255,0))
        blur(10px);

      animation:
        revealLogoIn 1.15s
        cubic-bezier(.16,1,.3,1)
        .2s forwards,

        revealLogoOut .65s
        ease-in
        1.65s forwards;
    }

    .reveal-line {
      position: relative;
      z-index: 2;

      width: 0;
      height: 1px;

      margin-top: 26px;

      background: linear-gradient(
        90deg,
        transparent,
        #1683ff,
        transparent
      );

      animation: revealLineIn .75s
        cubic-bezier(.16,1,.3,1)
        .7s forwards;
    }

    @keyframes revealLogoIn {
      0% {
        opacity: 0;
        transform: scale(.72);
        filter:
          drop-shadow(0 0 0 rgba(22,131,255,0))
          blur(10px);
      }

      60% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter:
          drop-shadow(0 0 45px rgba(22,131,255,.28))
          blur(0);
      }
    }

    @keyframes revealLogoOut {
      to {
        opacity: 0;
        transform: scale(1.045);
        filter:
          drop-shadow(0 0 65px rgba(22,131,255,.2))
          blur(2px);
      }
    }

    @keyframes revealGlow {
      0% {
        opacity: 0;
        transform: scale(.65);
      }

      40% {
        opacity: 1;
      }

      100% {
        opacity: .2;
        transform: scale(1.12);
      }
    }

    @keyframes revealLineIn {
      to {
        width: 160px;
      }
    }

    @keyframes revealScreenOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @media (max-width: 700px) {
      .logo-reveal-glow {
        width: 320px;
        height: 320px;
      }

      .reveal-logo {
        width: min(210px, 58vw);
      }

      .reveal-line {
        margin-top: 20px;
      }
      }
    /* ZORVAN LOGO — WHITE BACKGROUND TEST */
.reveal-logo {
  mix-blend-mode: multiply;
}
  </style>
</head>
