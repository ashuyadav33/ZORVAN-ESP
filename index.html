<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZORVAN ESPORTS</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070b;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}

#reveal{
position:fixed;inset:0;z-index:10;
display:grid;place-items:center;
background:#05070b;
animation:leave .7s ease 1.9s forwards;
pointer-events:none;
}
#logo{
width:min(62vw,420px);
animation:show 1.2s ease forwards;
}
#name{
position:absolute;bottom:42px;width:100%;
text-align:center;font-size:12px;font-weight:700;
letter-spacing:.35em;opacity:0;
animation:showName 1s ease 1s forwards;
}

#hero{
min-height:100vh;
display:flex;align-items:center;
padding:80px 8vw;
}
#hero div{max-width:750px}
small{color:#1683ff;font-weight:700;letter-spacing:.2em}
h1{
font-size:clamp(55px,8vw,110px);
line-height:.9;margin:20px 0;
letter-spacing:-.05em;
}
h1 span{color:#1683ff}
p{max-width:560px;color:#8d96a5;font-size:16px;line-height:1.7}

@keyframes show{
from{opacity:0;transform:scale(.82)}
to{opacity:1;transform:scale(1)}
}
@keyframes showName{to{opacity:.8}}
@keyframes leave{to{opacity:0;visibility:hidden}}

@media(max-width:600px){
#logo{width:72vw}
#name{bottom:28px;font-size:9px;letter-spacing:.25em}
#hero{padding:70px 22px}
h1{font-size:clamp(48px,17vw,75px)}
p{font-size:14px}
}
</style>
</head>

<body>

<div id="reveal">
<img id="logo" src="./logo.png" alt="ZORVAN">
<div id="name">ZORVAN ESPORTS</div>
</div>

<section id="hero">
<div>
<small>THE NEXT GENERATION OF ESPORTS</small>
<h1>PLAY.<br>COMPETE.<br><span>RISE.</span></h1>
<p>A competitive esports platform built around players, performance, community and legacy.</p>
</div>
</section>

</body>

<script>
const data={
PLAYER:["PLAYER IDENTITY","YOUR GAME.<br>YOUR LEGACY.","Build your competitive identity with profile, performance history, achievements and rankings."],
TOURNAMENTS:["COMPETITIVE ARENA","ENTER. COMPETE. RISE.","Discover upcoming tournaments, match details, rules, slots and competitive opportunities."],
TEAMS:["TEAM IDENTITY","BUILD TOGETHER.","Create teams, manage members, track team history and compete as a unit."],
RANKINGS:["PERFORMANCE","EARN YOUR PLACE.","Track verified competitive performance across players, teams and tournaments."]
};
document.querySelectorAll(".zv-feature-list button").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".zv-feature-list button").forEach(b=>b.classList.remove("active"));

let d=data[btn.textContent];

`<small>${d[0]}</small><h3>${d[1]}</h3><p>${d[2]}</p>`;
};
});
</script>
