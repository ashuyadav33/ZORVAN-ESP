<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#05070b">

<title>ZORVAN ESPORTS — PLAY. COMPETE. RISE.</title>

<style>

/* =========================================================
   ZORVAN ESPORTS
   PART 1 — FOUNDATION + LOGO REVEAL + NAVBAR
   ========================================================= */

:root{
    --bg:#05070b;
    --bg-soft:#080b12;
    --blue:#1687ff;
    --blue-bright:#35a7ff;
    --white:#ffffff;
    --muted:#8d98a8;
    --line:rgba(255,255,255,.09);
}

/* ---------- RESET ---------- */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    background:var(--bg);
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--white);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x:hidden;
}

/* ---------- MAIN BACKGROUND ---------- */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(18,116,255,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 70%,
            rgba(35,92,255,.06),
            transparent 30%
        ),
        #05070b;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;

    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(25,130,255,.035) 45%,
            transparent 55%
        );

    animation:bgSweep 9s ease-in-out infinite;
}

@keyframes bgSweep{

    0%{
        transform:translateX(-35%);
    }

    50%{
        transform:translateX(35%);
    }

    100%{
        transform:translateX(-35%);
    }
}


/* =========================================================
   LOGO REVEAL
   ========================================================= */

.logo-reveal{

    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#05070b;

    overflow:hidden;

    animation:
        revealScreenOut .9s cubic-bezier(.77,0,.18,1) 3.4s
        forwards;
}


/* subtle blue atmospheric glow */

.logo-reveal::before{

    content:"";

    position:absolute;

    width:55vw;
    height:55vw;

    max-width:700px;
    max-height:700px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(20,125,255,.20) 0%,
            rgba(20,125,255,.08) 32%,
            transparent 70%
        );

    filter:blur(25px);

    animation:revealGlow 2.8s ease-out forwards;

    pointer-events:none;
}


/* secondary blue light */

.logo-reveal::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:rgba(30,140,255,.18);

    filter:blur(80px);

    animation:
        revealLight 2.8s ease-out forwards;

    pointer-events:none;
}


@keyframes revealGlow{

    0%{
        opacity:0;
        transform:scale(.55);
    }

    35%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:.45;
        transform:scale(1.25);
    }
}


@keyframes revealLight{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    40%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.8);
    }
}


/* ---------- LOGO ---------- */

.reveal-logo-wrap{

    position:relative;

    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;

    width:min(78vw,620px);

    animation:
        logoEntrance 1.35s
        cubic-bezier(.16,1,.3,1)
        .35s
        both;
}


.reveal-logo{

    display:block;

    width:100%;
    height:auto;

    /*
      IMPORTANT:
      No canvas processing.
      No blur.
      No mix-blend-mode.
      Original uploaded logo stays sharp.
    */

    filter:
        drop-shadow(0 0 18px rgba(20,130,255,.28))
        drop-shadow(0 0 45px rgba(20,110,255,.14));

    user-select:none;
    -webkit-user-drag:none;
}


@keyframes logoEntrance{

    0%{
        opacity:0;
        transform:
            scale(.72)
            translateY(18px);
        filter:
            blur(8px)
            drop-shadow(0 0 0 transparent);
    }

    45%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
        filter:
            blur(0)
            drop-shadow(0 0 18px rgba(20,130,255,.28))
            drop-shadow(0 0 45px rgba(20,110,255,.14));
    }
}


/* ---------- REVEAL LINE ---------- */

.reveal-line{

    position:absolute;

    left:50%;
    bottom:-55px;

    width:0;
    height:1px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            #1687ff,
            #ffffff,
            #1687ff,
            transparent
        );

    box-shadow:
        0 0 12px rgba(30,140,255,.8),
        0 0 35px rgba(30,140,255,.35);

    animation:
        revealLine 1.2s
        cubic-bezier(.16,1,.3,1)
        1.15s
        forwards;
}


@keyframes revealLine{

    0%{
        width:0;
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        width:min(55vw,420px);
        opacity:1;
    }
}


/* ---------- SCREEN EXIT ---------- */

@keyframes revealScreenOut{

    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        visibility:hidden;
        transform:scale(1.025);
    }
}


/* =========================================================
   NAVBAR
   ========================================================= */

.navbar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:1000;

    height:82px;

    display:flex;
    align-items:center;

    padding:
        0
        clamp(20px,5vw,70px);

    background:
        linear-gradient(
            180deg,
            rgba(5,7,11,.94),
            rgba(5,7,11,.55),
            transparent
        );

    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,.035);
}


/* ---------- NAV LOGO ---------- */

.nav-logo-link{

    display:flex;
    align-items:center;

    text-decoration:none;

    flex-shrink:0;
}


.nav-logo{

    display:block;

    width:
        clamp(115px,13vw,175px);

    height:auto;

    /*
      Same original logo.
      No JS manipulation.
    */

    filter:
        drop-shadow(
            0 0 12px
            rgba(20,130,255,.18)
        );

    transition:
        transform .35s ease,
        filter .35s ease;
}


.nav-logo-link:hover .nav-logo{

    transform:translateY(-1px);

    filter:
        drop-shadow(
            0 0 18px
            rgba(25,140,255,.4)
        );
}


/* ---------- NAV LINKS ---------- */

.nav-links{

    display:flex;

    align-items:center;

    gap:clamp(22px,3vw,48px);

    margin-left:auto;
}


.nav-links a{

    position:relative;

    color:#aeb7c5;

    text-decoration:none;

    font-size:12px;

    font-weight:700;

    letter-spacing:.16em;

    transition:
        color .3s ease;
}


.nav-links a::after{

    content:"";

    position:absolute;

    left:0;
    bottom:-9px;

    width:0;
    height:1px;

    background:#1687ff;

    box-shadow:
        0 0 10px rgba(22,135,255,.7);

    transition:
        width .3s ease;
}


.nav-links a:hover{

    color:#fff;
}


.nav-links a:hover::after{

    width:100%;
}


/* ---------- CTA ---------- */

.nav-cta{

    margin-left:
        clamp(20px,3vw,42px);

    padding:
        11px 19px;

    border:1px solid
        rgba(50,155,255,.5);

    border-radius:6px;

    background:
        rgba(20,110,255,.08);

    color:#fff;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    letter-spacing:.13em;

    transition:
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease,
        transform .3s ease;
}


.nav-cta:hover{

    background:
        rgba(20,125,255,.18);

    border-color:
        rgba(70,170,255,.9);

    box-shadow:
        0 0 24px
        rgba(20,125,255,.18);

    transform:translateY(-1px);
}


/* ---------- MOBILE MENU ---------- */

.mobile-menu{

    display:none;

    margin-left:auto;

    width:42px;
    height:42px;

    border:1px solid
        rgba(255,255,255,.1);

    border-radius:8px;

    background:
        rgba(255,255,255,.025);

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:5px;
}


.mobile-menu span{

    width:17px;
    height:1px;

    background:#fff;
}


/* =========================================================
   EMPTY HERO FOUNDATION
   ========================================================= */

.hero{

    min-height:100vh;

    position:relative;

    display:flex;
    align-items:center;

    justify-content:center;

    padding:
        130px 7vw 80px;

    overflow:hidden;
}


.hero-grid{

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:
        80px 80px;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.45),
            transparent 80%
        );
}


.hero-content{

    position:relative;

    z-index:2;

    width:min(1200px,100%);

    text-align:center;
}


.hero-kicker{

    color:#6e7c8e;

    font-size:11px;

    font-weight:700;

    letter-spacing:.3em;

    text-transform:uppercase;
}


.hero-title{

    margin-top:18px;

    font-size:
        clamp(42px,8vw,105px);

    line-height:.9;

    letter-spacing:-.055em;

    font-weight:900;
}


.hero-title span{

    color:#1687ff;

    text-shadow:
        0 0 35px
        rgba(22,135,255,.22);
}


.hero-subtitle{

    max-width:620px;

    margin:
        28px auto 0;

    color:#8994a4;

    font-size:
        clamp(14px,1.4vw,17px);

    line-height:1.7;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){

    .navbar{

        height:70px;

        padding:
            0 18px;
    }


    .nav-links,
    .nav-cta{

        display:none;
    }


    .mobile-menu{

        display:flex;
    }


    .nav-logo{

        width:125px;
    }


    .reveal-logo-wrap{

        width:78vw;
    }


    .reveal-line{

        bottom:-35px;
    }


    .hero{

        padding:
            100px 20px 60px;
    }


    .hero-grid{

        background-size:
            55px 55px;
    }


    .hero-title{

        font-size:
            clamp(45px,15vw,75px);
    }

}


/* ---------- SMALL PHONES ---------- */

@media(max-width:380px){

    .nav-logo{

        width:112px;
    }


    .reveal-logo-wrap{

        width:82vw;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     LOGO REVEAL
     ===================================================== -->

<div class="logo-reveal">

    <div class="reveal-logo-wrap">

        <img
            src="./logo.png"
            class="reveal-logo"
            alt="ZORVAN ESPORTS"
        >

        <div class="reveal-line"></div>

    </div>

</div>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<header class="navbar">

    <a
        href="#"
        class="nav-logo-link"
        aria-label="ZORVAN Esports Home"
    >

        <img
            src="./logo.png"
            class="nav-logo"
            alt="ZORVAN ESPORTS"
        >

    </a>


    <nav class="nav-links">

        <a href="#about">ABOUT</a>

        <a href="#features">FEATURES</a>

        <a href="#legacy">LEGACY</a>

        <a href="#community">COMMUNITY</a>

    </nav>


    <a
        href="#preregister"
        class="nav-cta"
    >
        PRE-REGISTER
    </a>


    <button
        class="mobile-menu"
        aria-label="Open menu"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>


<!-- =====================================================
     HERO FOUNDATION
     ===================================================== -->

<main>

<section class="hero">

    <div class="hero-grid"></div>

    <div class="hero-content">

        <div class="hero-kicker">
            THE NEXT GENERATION OF ESPORTS
        </div>

        <h1 class="hero-title">
            PLAY.<br>
            <span>COMPETE.</span><br>
            RISE.
        </h1>

        <p class="hero-subtitle">
            A competitive esports platform built around players,
            performance, community and legacy.
        </p>

    </div>

</section>

</main>


</body>
</html>
<script>
/* =========================================================
   ZORVAN — HERO ENHANCEMENT
   END-PASTE ONLY
   ========================================================= */

(function () {

    const hero = document.querySelector(".hero");
    if (!hero) return;

    /* ---------- HERO VISUAL ---------- */

    let visual = hero.querySelector(".hero-visual");

    if (!visual) {
        visual = document.createElement("div");
        visual.className = "hero-visual";

        visual.innerHTML = `
            <div class="hero-visual-ring ring-1"></div>
            <div class="hero-visual-ring ring-2"></div>
            <div class="hero-visual-ring ring-3"></div>

            <div class="hero-light-line line-1"></div>
            <div class="hero-light-line line-2"></div>

            <div class="hero-core">
                <span>Z</span>
            </div>
        `;

        hero.appendChild(visual);
    }


    /* ---------- HERO ACTIONS ---------- */

    const content = hero.querySelector(".hero-content");

    if (content && !hero.querySelector(".zorvan-hero-actions")) {

        const actions = document.createElement("div");
        actions.className = "zorvan-hero-actions";

        actions.innerHTML = `
            <a href="#preregister" class="zorvan-hero-primary">
                PRE-REGISTER
                <span>↗</span>
            </a>

            <a href="#features" class="zorvan-hero-secondary">
                EXPLORE ZORVAN
            </a>
        `;

        content.appendChild(actions);
    }


    /* ---------- STATUS ---------- */

    if (content && !hero.querySelector(".zorvan-hero-status")) {

        const status = document.createElement("div");

        status.className = "zorvan-hero-status";

        status.innerHTML = `
            <i></i>
            PLATFORM DEVELOPMENT IN PROGRESS
        `;

        content.appendChild(status);
    }


    /* ---------- STYLE ---------- */

    const style = document.createElement("style");

    style.textContent = `

    /* ================= HERO ================= */

    .hero{
        position:relative;
        overflow:hidden;
        isolation:isolate;
    }


    .hero::before{

        content:"";

        position:absolute;

        width:650px;
        height:650px;

        left:-260px;
        top:8%;

        border-radius:50%;

        background:
            radial-gradient(
                circle,
                rgba(20,130,255,.13),
                rgba(20,130,255,.035) 42%,
                transparent 72%
            );

        filter:blur(18px);

        pointer-events:none;

        animation:
            zorvanAmbient 7s ease-in-out infinite;
    }


    .hero::after{

        content:"";

        position:absolute;

        width:520px;
        height:1px;

        right:-130px;
        top:43%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(35,145,255,.55),
                transparent
            );

        box-shadow:
            0 0 25px rgba(25,130,255,.3);

        transform:rotate(-27deg);

        pointer-events:none;

        opacity:.55;
    }


    @keyframes zorvanAmbient{

        0%,100%{
            transform:scale(.95);
            opacity:.55;
        }

        50%{
            transform:scale(1.08);
            opacity:1;
        }

    }


    /* ================= VISUAL ================= */

    .hero-visual{

        position:absolute;

        width:min(48vw,680px);
        aspect-ratio:1;

        right:-2vw;
        top:50%;

        transform:translateY(-50%);

        pointer-events:none;

        z-index:-1;

        opacity:.82;
    }


    .hero-visual-ring{

        position:absolute;

        inset:15%;

        border-radius:50%;

        border:
            1px solid rgba(30,140,255,.13);

        box-shadow:
            0 0 70px rgba(20,120,255,.045);

        animation:
            zorvanRing 7s ease-in-out infinite;
    }


    .hero-visual-ring.ring-2{

        inset:25%;

        border-color:
            rgba(255,255,255,.055);

        animation-duration:9s;

        animation-direction:reverse;
    }


    .hero-visual-ring.ring-3{

        inset:36%;

        border-color:
            rgba(30,140,255,.12);

        animation-duration:6s;
    }


    @keyframes zorvanRing{

        0%,100%{
            transform:scale(.96) rotate(0deg);
            opacity:.45;
        }

        50%{
            transform:scale(1.035) rotate(8deg);
            opacity:1;
        }

    }


    /* ================= LIGHT LINES ================= */

    .hero-light-line{

        position:absolute;

        width:100%;

        height:1px;

        top:50%;

        left:0;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(30,145,255,.55),
                rgba(255,255,255,.13),
                transparent
            );

        box-shadow:
            0 0 18px rgba(25,130,255,.2);

        transform:rotate(-28deg);
    }


    .hero-light-line.line-2{

        transform:rotate(28deg);

        opacity:.35;
    }


    /* ================= CORE ================= */

    .hero-core{

        position:absolute;

        inset:42%;

        display:flex;

        align-items:center;
        justify-content:center;

        border-radius:50%;

        background:
            radial-gradient(
                circle,
                rgba(30,140,255,.12),
                transparent 68%
            );

        border:
            1px solid rgba(35,145,255,.12);

        box-shadow:
            0 0 70px rgba(20,120,255,.08);

        animation:
            zorvanCore 4s ease-in-out infinite;
    }


    .hero-core span{

        font-size:clamp(45px,6vw,80px);

        font-weight:900;

        color:
            rgba(50,155,255,.12);

        letter-spacing:-.08em;

        text-shadow:
            0 0 35px rgba(25,135,255,.15);
    }


    @keyframes zorvanCore{

        0%,100%{
            transform:scale(.94);
        }

        50%{
            transform:scale(1.06);
        }

    }


    /* ================= BUTTONS ================= */

    .zorvan-hero-actions{

        display:flex;

        align-items:center;

        gap:13px;

        margin-top:30px;
    }


    .zorvan-hero-primary,
    .zorvan-hero-secondary{

        min-height:48px;

        padding:0 21px;

        display:inline-flex;

        align-items:center;
        justify-content:center;

        gap:10px;

        border-radius:6px;

        text-decoration:none;

        font-size:10px;

        font-weight:800;

        letter-spacing:.14em;

        transition:
            transform .3s ease,
            background .3s ease,
            border-color .3s ease,
            box-shadow .3s ease;
    }


    .zorvan-hero-primary{

        color:#fff;

        background:#1687ff;

        border:1px solid #1687ff;

        box-shadow:
            0 0 22px rgba(20,130,255,.16);
    }


    .zorvan-hero-primary span{

        font-size:15px;

        line-height:1;

        transition:
            transform .3s ease;
    }


    .zorvan-hero-primary:hover{

        transform:translateY(-2px);

        background:#2794ff;

        box-shadow:
            0 0 34px rgba(20,130,255,.3);
    }


    .zorvan-hero-primary:hover span{

        transform:translate(2px,-2px);
    }


    .zorvan-hero-secondary{

        color:#d7dfe9;

        border:
            1px solid rgba(255,255,255,.11);

        background:
            rgba(255,255,255,.025);
    }


    .zorvan-hero-secondary:hover{

        transform:translateY(-2px);

        border-color:
            rgba(35,145,255,.45);

        background:
            rgba(20,120,255,.07);
    }


    /* ================= STATUS ================= */

    .zorvan-hero-status{

        display:flex;

        align-items:center;

        gap:9px;

        margin-top:23px;

        color:#667384;

        font-size:9px;

        font-weight:700;

        letter-spacing:.14em;
    }


    .zorvan-hero-status i{

        width:6px;
        height:6px;

        display:block;

        border-radius:50%;

        background:#1687ff;

        box-shadow:
            0 0 10px rgba(20,135,255,.9);

        animation:
            zorvanStatus 2s ease-in-out infinite;
    }


    @keyframes zorvanStatus{

        0%,100%{
            opacity:.45;
        }

        50%{
            opacity:1;
        }
    }


    /* ================= MOBILE ================= */

    @media(max-width:800px){

        .hero-visual{

            width:125vw;

            right:-55vw;

            top:39%;

            opacity:.28;
        }


        .zorvan-hero-actions{

            width:100%;

            margin-top:25px;
        }


        .zorvan-hero-primary,
        .zorvan-hero-secondary{

            flex:1;

            min-height:46px;

            padding:0 10px;

            font-size:8.5px;

            letter-spacing:.09em;
        }


        .zorvan-hero-status{

            margin-top:21px;

            font-size:7.5px;

            letter-spacing:.11em;
        }

    }


    @media(max-width:380px){

        .zorvan-hero-primary,
        .zorvan-hero-secondary{

            font-size:8px;
        }

    }

    `;

    document.head.appendChild(style);


    /* ---------- MOUSE PARALLAX — DESKTOP ONLY ---------- */

    if (window.matchMedia("(min-width:801px)").matches) {

        hero.addEventListener("mousemove", function (event) {

            const rect = hero.getBoundingClientRect();

            const x =
                (event.clientX - rect.left) /
                rect.width - .5;

            const y =
                (event.clientY - rect.top) /
                rect.height - .5;

            visual.style.transform =
                `translate(
                    ${x * 10}px,
