<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORVAN ESPORTS — PLAY. COMPETE. RISE.</title>

</body>

<script>
(() => {
  if (window.__ZORVAN_V2_FOUNDATION__) return;
  window.__ZORVAN_V2_FOUNDATION__ = true;

  /* =========================================================
     ZORVAN V2 — FOUNDATION + CINEMATIC LOGO REVEAL
     PART 1/2
     END-PASTE ONLY
     ========================================================= */

  const style = document.createElement("style");

  style.textContent = `
    :root{
      --z-black:#05070b;
      --z-black-2:#070a10;
      --z-blue:#1687ff;
      --z-blue-bright:#4da5ff;
      --z-white:#f4f8fc;
      --z-muted:#7b8795;
      --z-line:rgba(255,255,255,.07);
    }

    *,
    *::before,
    *::after{
      box-sizing:border-box;
    }

    html{
      margin:0;
      padding:0;
      background:var(--z-black);
      scroll-behavior:smooth;
      overflow-x:hidden;
    }

    body{
      margin:0;
      padding:0;
      min-width:0;
      width:100%;
      overflow-x:hidden;
      background:var(--z-black);
      color:var(--z-white);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body.zorvan-locked{
      overflow:hidden;
    }

    button,
    a{
      font:inherit;
    }

    button{
      border:0;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    ::selection{
      color:#fff;
      background:rgba(22,135,255,.35);
    }


    /* =====================================================
       GLOBAL BACKGROUND
       ===================================================== */

    .zv-site{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      background:
        radial-gradient(
          circle at 50% 8%,
          rgba(17,100,190,.10),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #05070b 0%,
          #05070b 55%,
          #06080d 100%
        );
    }

    .zv-site::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.42;
      background:
        linear-gradient(
          rgba(255,255,255,.014) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.014) 1px,
          transparent 1px
        );
      background-size:72px 72px;
      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 88%
        );
    }

    .zv-site::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0,0,0,.28) 100%
        );
    }


    /* =====================================================
       LOGO REVEAL
       ===================================================== */

    .zv-reveal{
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#05070b;
      opacity:1;
      visibility:visible;
    }

    .zv-reveal-bg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(
          circle at center,
          rgba(12,95,190,.13),
          transparent 32%
        ),
        #05070b;
    }

    .zv-reveal-grid{
      position:absolute;
      inset:-10%;
      opacity:.25;
      background:
        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );
      background-size:70px 70px;
      transform:perspective(700px) rotateX(58deg) scale(1.4);
      transform-origin:center bottom;
      mask-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          black 38%,
          transparent 100%
        );
    }

    .zv-reveal-glow{
      position:absolute;
      width:min(62vw,620px);
      aspect-ratio:1;
      border-radius:50%;
      background:
        radial-gradient(
          circle,
          rgba(20,130,255,.18),
          rgba(20,130,255,.06) 32%,
          transparent 68%
        );
      filter:blur(10px);
      opacity:0;
      transform:scale(.7);
    }

    .zv-reveal-logo-wrap{
      position:relative;
      z-index:4;
      width:min(360px,72vw);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      transform:
        translateY(22px)
        scale(.88);
    }

    .zv-reveal-logo{
      display:block;
      width:100%;
      height:auto;
      max-height:220px;
      object-fit:contain;
      object-position:center;
      user-select:none;
      -webkit-user-drag:none;
    }

    .zv-reveal-line{
      position:absolute;
      z-index:5;
      left:50%;
      top:calc(50% + 150px);
      width:min(280px,55vw);
      height:1px;
      transform:
        translateX(-50%)
        scaleX(0);
      transform-origin:center;
      background:
        linear-gradient(
          90deg,
          transparent,
          #1687ff,
          transparent
        );
      box-shadow:
        0 0 18px rgba(22,135,255,.7);
    }

    .zv-reveal-sweep{
      position:absolute;
      z-index:6;
      top:-15%;
      left:-20%;
      width:2px;
      height:130%;
      opacity:0;
      transform:rotate(18deg);
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(95,180,255,.9),
          transparent
        );
      box-shadow:
        0 0 35px rgba(30,145,255,.65);
    }

    .zv-reveal-label{
      position:absolute;
      z-index:7;
      left:50%;
      bottom:52px;
      transform:translateX(-50%);
      color:rgba(255,255,255,.36);
      font-size:8px;
      font-weight:800;
      letter-spacing:.34em;
      white-space:nowrap;
    }


    /* =====================================================
       MAIN SITE STATE
       ===================================================== */

    .zv-main{
      position:relative;
      z-index:3;
      min-height:100vh;
      opacity:0;
      transform:translateY(12px);
    }


    /* =====================================================
       RESPONSIVE FOUNDATION
       ===================================================== */

    @media(max-width:700px){

      .zv-reveal-logo-wrap{
        width:min(300px,76vw);
      }

      .zv-reveal-logo{
        max-height:170px;
      }

      .zv-reveal-line{
        top:calc(50% + 115px);
        width:190px;
      }

      .zv-reveal-label{
        bottom:32px;
        font-size:7px;
        letter-spacing:.25em;
      }

      .zv-site::before{
        background-size:52px 52px;
      }
    }

    @media(prefers-reduced-motion:reduce){

      html{
        scroll-behavior:auto;
      }

      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  `;

  document.head.appendChild(style);


  /* =====================================================
     CREATE SITE SHELL
     ===================================================== */

  const site = document.createElement("div");
  site.className = "zv-site";

  const main = document.createElement("main");
  main.className = "zv-main";
  main.id = "zorvan-main";

  const reveal = document.createElement("div");
  reveal.className = "zv-reveal";
  reveal.setAttribute("aria-label","ZORVAN");

  reveal.innerHTML = `
    <div class="zv-reveal-bg"></div>
    <div class="zv-reveal-grid"></div>
    <div class="zv-reveal-glow"></div>

    <div class="zv-reveal-logo-wrap">
      <img
        class="zv-reveal-logo"
        src="./logo.png"
        alt="ZORVAN Esports"
        draggable="false"
      >
    </div>

    <div class="zv-reveal-line"></div>
    <div class="zv-reveal-sweep"></div>

    <div class="zv-reveal-label">
      ZORVAN ESPORTS
    </div>
  `;

  site.appendChild(main);
  document.body.appendChild(site);
  document.body.appendChild(reveal);

  document.body.classList.add("zorvan-locked");


  /* =====================================================
     REVEAL ANIMATION
     ===================================================== */

  const logoWrap =
    reveal.querySelector(".zv-reveal-logo-wrap");

  const glow =
    reveal.querySelector(".zv-reveal-glow");

  const line =
    reveal.querySelector(".zv-reveal-line");

  const sweep =
    reveal.querySelector(".zv-reveal-sweep");

  const finishReveal = () => {

    if (reveal.dataset.finished === "true") return;

    reveal.dataset.finished = "true";

    reveal.style.transition =
      "opacity .9s cubic-bezier(.16,1,.3,1)";

    reveal.style.opacity = "0";

    main.style.transition =
      "opacity 1s ease, transform 1s cubic-bezier(.16,1,.3,1)";

    main.style.opacity = "1";
    main.style.transform = "translateY(0)";

    window.setTimeout(() => {
      reveal.remove();
      document.body.classList.remove("zorvan-locked");
    }, 950);
  };


  /* Start reveal */

  requestAnimationFrame(() => {

    logoWrap.style.transition =
      "opacity 1.15s cubic-bezier(.16,1,.3,1), transform 1.2s cubic-bezier(.16,1,.3,1)";

    glow.style.transition =
      "opacity 1.2s ease, transform 1.4s cubic-bezier(.16,1,.3,1)";

    line.style.transition =
      "transform .9s cubic-bezier(.16,1,.3,1)";

    logoWrap.style.opacity = "1";
    logoWrap.style.transform =
      "translateY(0) scale(1)";

    glow.style.opacity = "1";
    glow.style.transform = "scale(1)";

    window.setTimeout(() => {
      line.style.transform =
        "translateX(-50%) scaleX(1)";
    }, 650);

    window.setTimeout(() => {

      sweep.style.transition =
        "left 1.15s cubic-bezier(.16,1,.3,1), opacity .25s ease";

      sweep.style.opacity = ".9";
      sweep.style.left = "120%";

    }, 850);

    window.setTimeout(finishReveal, 2600);
  });


  /* =====================================================
     LOGO ERROR FALLBACK
     ===================================================== */

  const logo =
    reveal.querySelector(".zv-reveal-logo");

  logo.addEventListener("error", () => {

    console.warn(
      "ZORVAN: logo.png could not be loaded."
    );

    logoWrap.style.opacity = "1";
    logoWrap.style.transform = "none";
  });


})();
</script>
<script>
(() => {
  if (window.__ZORVAN_V2_HERO__) return;
  window.__ZORVAN_V2_HERO__ = true;

  /* =========================================================
     ZORVAN V2 — NAVIGATION + HERO
     PART 2/2
     END-PASTE ONLY
     ========================================================= */

  const main = document.getElementById("zorvan-main");

  if (!main) return;


  /* =====================================================
     STYLES
     ===================================================== */

  const style = document.createElement("style");

  style.textContent = `

    /* =====================================================
       NAVIGATION
       ===================================================== */

    .zv-nav{
      position:absolute;
      top:0;
      left:0;
      right:0;
      z-index:50;

      height:88px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 5.5vw;

      border-bottom:1px solid rgba(255,255,255,.055);

      background:
        linear-gradient(
          180deg,
          rgba(5,7,11,.92),
          rgba(5,7,11,.45)
        );

      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }


    .zv-nav-brand{
      display:flex;
      align-items:center;
      gap:12px;

      min-width:0;
    }


    .zv-nav-logo{
      display:block;

      width:112px;
      height:42px;

      object-fit:contain;
      object-position:left center;

      user-select:none;
      -webkit-user-drag:none;
    }


    .zv-nav-divider{
      width:1px;
      height:22px;

      background:rgba(255,255,255,.12);
    }


    .zv-nav-brand-text{
      color:rgba(255,255,255,.38);

      font-size:8px;
      font-weight:800;

    .zv-nav-links{
      display:flex;
      align-items:center;
      gap:34px;
    }


    .zv-nav-link{
      position:relative;

      color:rgba(255,255,255,.52);

      font-size:9px;
      font-weight:800;

      letter-spacing:.13em;

      padding:10px 0;

      transition:
        color .25s ease;
    }


    .zv-nav-link::after{
      content:"";

      position:absolute;

      left:0;
      right:0;
      bottom:3px;

      height:1px;

      background:#1687ff;

      transform:scaleX(0);
      transform-origin:center;

      transition:
        transform .3s ease;
    }


    .zv-nav-link:hover{
      color:#fff;
    }


    .zv-nav-link:hover::after{
      transform:scaleX(1);
    }


    .zv-nav-cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      min-height:40px;

      padding:0 19px;

      border:1px solid rgba(22,135,255,.42);

      background:
        linear-gradient(
          135deg,
          rgba(22,135,255,.15),
          rgba(22,135,255,.035)
        );

      color:#edf6ff;

      font-size:8px;
      font-weight:900;

      letter-spacing:.13em;

      cursor:pointer;

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }


    .zv-nav-cta:hover{
      transform:translateY(-2px);

      border-color:
        rgba(22,145,255,.85);

      background:
        rgba(22,135,255,.15);

      box-shadow:
        0 0 28px rgba(22,135,255,.16);
    }


    .zv-mobile-menu{
      display:none;

      width:42px;
      height:42px;

      align-items:center;
      justify-content:center;

      border:1px solid rgba(255,255,255,.08);

      background:rgba(255,255,255,.025);

      cursor:pointer;
    }


    .zv-mobile-menu span{
      position:relative;

      width:17px;
      height:1px;

      background:#fff;
    }


    .zv-mobile-menu span::before,
    .zv-mobile-menu span::after{
      content:"";

      position:absolute;

      left:0;

      width:17px;
      height:1px;

      background:#fff;
    }


    .zv-mobile-menu span::before{
      top:-6px;
    }


    .zv-mobile-menu span::after{
      top:6px;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .zv-hero{
      position:relative;

      min-height:100svh;

      display:flex;
      align-items:center;

      padding:
        150px
        6vw
        90px;

      overflow:hidden;

      background:
        radial-gradient(
          circle at 72% 48%,
          rgba(12,91,175,.12),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #05070b,
          #06090f
        );
    }


    .zv-hero::before{
      content:"";

      position:absolute;

      width:900px;
      height:900px;

      right:-420px;
      top:5%;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(20,130,255,.09),
          transparent 66%
        );

      pointer-events:none;
    }


    .zv-hero::after{
      content:"";

      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:180px;

      pointer-events:none;

      background:
        linear-gradient(
          to bottom,
          transparent,
          #05070b
        );
    }


    .zv-hero-grid{
      position:absolute;
      inset:0;

      pointer-events:none;

      opacity:.25;

      background:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size:80px 80px;

      mask-image:
        radial-gradient(
          ellipse at 70% 50%,
          black,
          transparent 72%
        );
    }


    .zv-hero-inner{
      position:relative;

      z-index:5;

      width:100%;
      max-width:1440px;

      margin:0 auto;

      display:grid;

      grid-template-columns:
        minmax(0,1.05fr)
        minmax(390px,.95fr);

      align-items:center;

      gap:70px;
    }


    /* =====================================================
       HERO COPY
       ===================================================== */

    .zv-hero-copy{
      min-width:0;

      max-width:760px;
    }


    .zv-eyebrow{
      display:flex;
      align-items:center;

      gap:12px;

      margin-bottom:28px;

      color:#4da2ff;

      font-size:9px;
      font-weight:900;

      letter-spacing:.25em;
    }


    .zv-eyebrow::before{
      content:"";

      width:30px;
      height:1px;

      background:#1687ff;

      box-shadow:
        0 0 13px rgba(22,135,255,.65);
    }


    .zv-hero-kicker{
      margin:0 0 14px;

      color:
        rgba(255,255,255,.54);

      font-size:
        clamp(11px,1.1vw,15px);

      font-weight:800;

      letter-spacing:.17em;
    }


    .zv-hero-title{
      margin:0;

      max-width:780px;

      color:#f5f8fc;

      font-size:
        clamp(68px,8.5vw,132px);

      line-height:.83;

      letter-spacing:-.075em;

      font-weight:950;

      text-wrap:balance;
    }


    .zv-hero-title span{
      display:block;

      color:#1687ff;

      text-shadow:
        0 0 35px rgba(22,135,255,.18);
    }


    .zv-hero-description{
      max-width:560px;

      margin:34px 0 0;

      color:#7d8997;

      font-size:
        clamp(13px,1.1vw,16px);

      line-height:1.8;
    }


    .zv-hero-actions{
      display:flex;
      align-items:center;

      flex-wrap:wrap;

      gap:12px;

      margin-top:38px;
    }


    .zv-button{
      min-height:50px;

      padding:0 22px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      gap:14px;

      cursor:pointer;

      font-size:9px;
      font-weight:900;

      letter-spacing:.15em;

      transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }


    .zv-button-primary{
      color:#fff;

      border:1px solid #1687ff;

      background:
        linear-gradient(
          135deg,
          #126fd2,
          #1687ff
        );

      box-shadow:
        0 10px 35px rgba(22,135,255,.12);
    }


    .zv-button-primary:hover{
      transform:translateY(-3px);

      box-shadow:
        0 14px 40px rgba(22,135,255,.24);
    }


    .zv-button-secondary{
      color:#d9e4ee;

      border:1px solid rgba(255,255,255,.11);

      background:
        rgba(255,255,255,.025);
    }


    .zv-button-secondary:hover{
      transform:translateY(-3px);

      border-color:
        rgba(255,255,255,.24);

      background:
        rgba(255,255,255,.055);
    }


    .zv-button-arrow{
      font-size:13px;
      line-height:1;
    }


    .zv-hero-status{

      align-items:center;

      gap:10px;

      font-size:8px;
      font-weight:800;

      letter-spacing:.16em;
    }


    .zv-status-dot{

      height:6px;

      border-radius:50%;

      background:#1687ff;

      box-shadow:
        0 0 12px rgba(22,135,255,.8);
    }

       HERO VISUAL
       ===================================================== */

    .zv-hero-visual{
      position:relative;

      min-height:570px;

      display:flex;
      align-items:center;
      justify-content:center;

      isolation:isolate;
    }


    .zv-visual-orbit{
      position:absolute;

      width:min(520px,42vw);
      aspect-ratio:1;

      border:1px solid rgba(22,135,255,.12);

      border-radius:50%;

      transform:rotate(-18deg);

      box-shadow:
        0 0 80px rgba(22,135,255,.045);
    }


    .zv-visual-orbit::before{
      content:"";

      position:absolute;

      inset:9%;

      border:1px solid rgba(255,255,255,.055);

      border-radius:50%;
    }


    .zv-visual-orbit::after{
      content:"";

      position:absolute;

      width:9px;
      height:9px;

      top:13%;
      right:18%;

      border-radius:50%;

      background:#1687ff;

      box-shadow:
        0 0 20px rgba(22,135,255,.8);
    }


    .zv-visual-core{
      position:relative;

      width:min(310px,25vw);
      aspect-ratio:1;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid rgba(22,135,255,.25);

      background:
        radial-gradient(
          circle,
          rgba(22,135,255,.13),
          rgba(5,7,11,.8) 63%
        );

      clip-path:
        polygon(
          50% 0%,
          91% 24%,
          100% 68%,
          67% 100%,
          25% 91%,
          0% 54%,
          13% 18%
        );

      box-shadow:
        0 0 80px rgba(22,135,255,.09);
    }


    .zv-visual-core::before{
      content:"";

      position:absolute;

      inset:18%;

      border:1px solid rgba(22,135,255,.16);

      clip-path:
        polygon(
          50% 0%,
          91% 24%,
          100% 68%,
          67% 100%,
          25% 91%,
          0% 54%,
          13% 18%
        );
    }


    .zv-visual-z{
      position:relative;

      color:#1687ff;

      font-size:
        clamp(95px,10vw,150px);

      line-height:.7;

      font-weight:950;

      letter-spacing:-.12em;

      transform:translateX(-4px);

      text-shadow:
        0 0 35px rgba(22,135,255,.25);
    }


    .zv-visual-label{
      position:absolute;

      left:50%;
      bottom:7%;

      transform:translateX(-50%);

  inset: 12%;
  border: 1px solid rgba(255,255,255,.055);
  border-radius: 50%;

  border-color: rgba(22,131,255,.12);

  position: absolute;
  width: 120%;
  height: 1px;
  left: -10%;
  top: 50%;

  );

.zv-visual-z {

  inset: 0;

  place-items: center;

  font-size: min(30vw,330px);

  line-height: 1;

}

  width: 28px;
  height: 28px;
  border-color: rgba(22,131,255,.55);
  border-style: solid;
}

  left: 0;
  border-width: 1px 0 0 1px;

        `translate(${x * 10}px,${y * 10}px)`;
