<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <title>ZORVAN — Competitive Esports</title>

  <meta
    name="description"
    content="ZORVAN — A new competitive esports experience."
  >

  <style>

    /* ==============================
       ZORVAN V2 — FOUNDATION
    ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #05070b;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #05070b;
      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: #1683ff;
      color: #ffffff;
    }


    /* ==============================
       CINEMATIC BACKGROUND
    ============================== */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: -2;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(22, 131, 255, 0.14),
          transparent 38%
        ),

        radial-gradient(
          circle at 85% 35%,
          rgba(116, 108, 255, 0.06),
          transparent 28%
        );
    }


    body::after {
      content: "";

      position: fixed;

      width: 520px;
      height: 520px;

      left: 50%;
      top: -260px;

      transform: translateX(-50%);

      pointer-events: none;

      z-index: -1;

      background:
        radial-gradient(
          circle,
          rgba(22, 131, 255, 0.12),
          transparent 68%
        );

      filter: blur(30px);
    }


    /* ==============================
       MOBILE FOUNDATION
    ============================== */

    @media (max-width: 700px) {

      body::after {
        width: 360px;
        height: 360px;
        top: -180px;
      }

    }

    /* ==============================
   ZORVAN — CINEMATIC LOGO REVEAL
============================== */

.logo-reveal {
  position: fixed;
  inset: 0;

  z-index: 9999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background: #05070b;

  pointer-events: none;

  animation:
    zorvan-reveal-out
    0.9s
    cubic-bezier(.77,0,.18,1)
    2.8s
    forwards;
}


/* Blue atmospheric glow */

.logo-reveal-glow {
  position: absolute;

  width: 460px;
  height: 460px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(22,131,255,.18),
      rgba(22,131,255,.05) 35%,
      transparent 70%
    );

  filter: blur(28px);

  animation:
    zorvan-glow
    2.6s
    ease-out
    forwards;
}


/* Logo container */

.reveal-logo-wrap {
  position: relative;
  z-index: 2;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  width: min(320px, 72vw);

  animation:
    zorvan-logo-in
    1.15s
    cubic-bezier(.16,1,.3,1)
    .15s
    forwards,

    zorvan-logo-out
    .65s
    ease-in
    2s
    forwards;
}


/*
  WHITE BACKGROUND TREATMENT

  This makes the pure-white area
  visually blend into the dark reveal.
*/

.reveal-logo {
  width: 100%;
  height: auto;

  display: block;

  mix-blend-mode: screen;

  opacity: 0;

  transform: scale(.72);

  filter:
    brightness(1.05)
    contrast(1.08)
    drop-shadow(
      0 0 0
      rgba(22,131,255,0)
    )
    blur(10px);
}


/* Blue reveal line */

.reveal-line {
  position: relative;
  z-index: 2;

  width: 0;
  height: 1px;

  margin-top: 28px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #1683ff,
      transparent
    );

  box-shadow:
    0 0 14px
    rgba(22,131,255,.75);

  animation:
    zorvan-line
    .75s
    cubic-bezier(.16,1,.3,1)
    .8s
    forwards;
}


/* ==============================
   ANIMATIONS
============================== */

@keyframes zorvan-logo-in {

  0% {
    opacity: 0;
    transform: scale(.72);
  }

  55% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }

}


@keyframes zorvan-logo-out {

  to {
    opacity: 0;
    transform: scale(1.045);
  }

}


@keyframes zorvan-glow {

  0% {
    opacity: 0;
    transform: scale(.65);
  }

  40% {
    opacity: 1;
  }

  100% {
    opacity: .2;
    transform: scale(1.12);
  }

}


@keyframes zorvan-line {

  to {
    width: 160px;
  }

}


@keyframes zorvan-reveal-out {

  0% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    visibility: hidden;
  }

}


/* ==============================
   MOBILE
============================== */

@media (max-width: 700px) {

  .logo-reveal-glow {
    width: 320px;
    height: 320px;
  }

  .reveal-logo-wrap {
    width: min(240px, 68vw);
  }

  .reveal-line {
    margin-top: 20px;
  }

}

  </style>

</head>


<body>

  <!-- ZORVAN V2 START -->
<body>

  <!-- ZORVAN V2 START -->

  <!-- CINEMATIC LOGO REVEAL -->

  <div class="logo-reveal">

    <div class="logo-reveal-glow"></div>

    <div class="reveal-logo-wrap">

      <img
        src="logo.png"
        class="reveal-logo"
        alt="ZORVAN"
      >

    </div>

    <div class="reveal-line"></div>

  </div>


</body>

</body>

</html>
