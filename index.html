<style>
#zv-reveal{
position:fixed;inset:0;z-index:9999;
display:grid;place-items:center;
background:#05070b;overflow:hidden;
}
#zv-reveal img{
width:min(62vw,420px);
display:block;opacity:0;
animation:zv-logo 1.5s ease .25s forwards;
}
#zv-name{
position:absolute;top:62%;
color:#fff;font:700 12px Arial;
letter-spacing:.35em;opacity:0;
animation:zv-name 1s ease 1.15s forwards;
}
@keyframes zv-logo{
from{opacity:0;transform:scale(.82)}
to{opacity:1;transform:scale(1)}
}
@keyframes zv-name{to{opacity:.8}}
@media(max-width:600px){
#zv-reveal img{width:72vw}
#zv-name{top:61%;font-size:9px;letter-spacing:.25em}
}
</style>

<div id="zv-reveal">
<img src="./logo.png" alt="ZORVAN">
<div id="zv-name">ZORVAN ESPORTS</div>
</div>
