<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZORVAN ESPORTS</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;
background:#05070b;overflow:hidden
}

#zv-reveal{
position:fixed;inset:0;
display:grid;place-items:center;
background:#05070b;
}

#zv-logo{
width:min(62vw,420px);
opacity:0;
animation:logo 1.5s ease .2s forwards;
}

#zv-name{
position:absolute;
bottom:45px;
left:0;
width:100%;
text-align:center;
color:#fff;
font:700 12px Arial;
letter-spacing:.35em;
opacity:0;
animation:name 1s ease 1.2s forwards;
}

@keyframes logo{
from{opacity:0;transform:scale(.82)}
to{opacity:1;transform:scale(1)}
}

@keyframes name{
to{opacity:.8}
}

@media(max-width:600px){
#zv-logo{width:72vw}
#zv-name{
bottom:28px;
font-size:9px;
letter-spacing:.25em;
}
}
</style>
</head>

<body>
<div id="zv-reveal">
<img id="zv-logo" src="./logo.png" alt="ZORVAN">
<div id="zv-name">ZORVAN ESPORTS</div>
</div>
</body>
</html>
<style>
#zv-hero{
min-height:100vh;background:#05070b;color:#fff;
display:flex;align-items:center;padding:90px 8vw;
}
#zv-copy{max-width:700px}
#zv-copy small{
color:#1683ff;letter-spacing:.22em;font-weight:700
}
#zv-copy h1{
font:900 clamp(55px,8vw,110px)/.9 Arial;
margin:18px 0;letter-spacing:-.05em
}
#zv-copy h1 span{color:#1683ff}
#zv-copy p{
max-width:560px;color:#8d96a5;
font:16px/1.7 Arial
}
@media(max-width:600px){
#zv-hero{padding:70px 22px}
#zv-copy h1{font-size:clamp(48px,17vw,75px)}
#zv-copy p{font-size:14px}
}
</style>

<section id="zv-hero">
<div id="zv-copy">
<small>THE NEXT GENERATION OF ESPORTS</small>
<h1>PLAY.<br>COMPETE.<br><span>RISE.</span></h1>
<p>
A competitive esports platform built around players,
performance, community and legacy.
</p>
</div>
</section>
<style>
#zv-reveal{
animation:zv-hide 1s ease 3.2s forwards;
pointer-events:none;
}
@keyframes zv-hide{
to{
opacity:0;
visibility:hidden;
}
}
#zv-hero{
position:relative;
z-index:1;
}
</style>
