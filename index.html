<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <title>ZORVAN — Competitive Esports</title>

  <meta
    name="description"
    content="ZORVAN — A new competitive esports experience."
  >

  <style>

    /* ==============================
       ZORVAN V2 — FOUNDATION
    ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #05070b;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #05070b;
      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: #1683ff;
      color: #ffffff;
    }


    /* ==============================
       CINEMATIC BACKGROUND
    ============================== */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: -2;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(22, 131, 255, 0.14),
          transparent 38%
        ),

        radial-gradient(
          circle at 85% 35%,
          rgba(116, 108, 255, 0.06),
          transparent 28%
        );
    }


    body::after {
      content: "";

      position: fixed;

      width: 520px;
      height: 520px;

      left: 50%;
      top: -260px;

      transform: translateX(-50%);

      pointer-events: none;

      z-index: -1;

      background:
        radial-gradient(
          circle,
          rgba(22, 131, 255, 0.12),
          transparent 68%
        );

      filter: blur(30px);
    }


    /* ==============================
       MOBILE FOUNDATION
    ============================== */

    @media (max-width: 700px) {

      body::after {
        width: 360px;
        height: 360px;
        top: -180px;
      }

    }

  </style>

</head>


<body>

  <!-- ZORVAN V2 START -->


</body>

</html>
